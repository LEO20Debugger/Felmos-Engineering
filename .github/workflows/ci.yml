name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      # One leg per deployable app. `api` and `admin` join this list as they
      # land — each needs its own package.json with `typecheck` and `build`
      # scripts, and nothing else here changes.
      matrix:
        app: [web]
      # A red web build shouldn't hide a red api build.
      fail-fast: false

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version Vercel builds with.
          node-version: 22
          cache: npm
          # setup-node resolves this from the repo root, not working-directory.
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Fail loudly on missing envs instead of falling back to dev defaults.
          NODE_ENV: production
