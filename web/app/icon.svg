<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon. The SAME drawing as components/brand/Logo.tsx, on a white tile.

    An earlier version of this file redrew the mark from scratch with the left
    tower removed, on the reasoning that at 16px the extra mass is mud. That
    reasoning was wrong in an important way: the left tower is a third of the
    silhouette, so dropping it does not simplify the mark, it makes a different
    one. Side by side with the site header the two read as two logos.

    So the path data below is copied verbatim from LogoMark, and the only
    departures are the two that cost nothing:

      - the glazing bars are dropped. They are sub pixel at any favicon size
        and only muddy the glass tower into grey.
      - the whole group is scaled and centred, because LogoMark is drawn edge
        to edge for a transparent context and would otherwise collide with this
        tile's rounded corners. 0.92 is as large as it goes while the splayed
        ends of the plinth stay clear of the corner radius, and it is worth
        pushing that far: every tenth of scale is another fraction of a device
        pixel on the reveal, which is the first thing to smear at 16px.

    Keep it that way. If the mark changes, copy the paths across again and rerun
    `npm run icons`, rather than redrawing to taste.

    White ground, matching the supplied artwork, so the mark keeps its own
    colours instead of being restated in a reversed palette. The tile also fixes
    the ground: a transparent favicon loses whichever of its masses matches the
    browser chrome behind it.

    Literal hex rather than var(): this file is served on its own, with no
    stylesheet behind it. The values are the light theme's accent-800, signal
    and accent-500 tokens from app/globals.css, and must be changed with them.

    Note for editors: no double hyphens anywhere in this comment. They are
    illegal inside an XML comment. Browsers shrug, but the SVG rasteriser in
    scripts/gen-icons.mjs refuses the file outright, which is how the token
    names that used to be written out here in full were caught.
  -->
  <rect width="64" height="64" rx="13" fill="#ffffff"/>
  <g transform="translate(2.56 3.94) scale(0.92)">
    <path d="M14 54 V40 H23 V54 Z" fill="#223c56"/>
    <path d="M22 54 V13 L26 3 H33.5 V54 Z" fill="#22a45d"/>
    <path d="M35 54 V23 H37 V54 Z" fill="#22a45d"/>
    <path d="M45.5 54 V30 H50 V54 Z" fill="#223c56"/>
    <path d="M38.5 54 V27 L41 24 H45.5 V54 Z" fill="#29a9e0"/>
    <path d="M6 58 L12 54 H52 L58 58 Z" fill="#223c56"/>
  </g>
</svg>
